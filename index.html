<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>极光聊天 · 玩家端</title>
  <script>
    if (localStorage.getItem('chat_username')) {
      document.documentElement.style.visibility = 'hidden';
    }
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, query, limitToLast,
      get, set, update, remove, onDisconnect
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myName = "";
    let myDeviceId = "";
    let currentGroupId = "";
    let myGroups = JSON.parse(localStorage.getItem('chat_mygroups') || "[]");
    let currentGroupInfo = {};
    let actionTargetName = "";
    let isAuthor = false;
    let banListenerBound = false;
    let heartbeatTimer = null;
    let onlineUsers = []; 

    // 本地精选违规词库
    let BAD_WORDS = [
      "傻逼", "操你妈", "妈的", "去死", "煞笔", "脑残", "婊子", "杂种", "龟儿子", "狗日", "贱人", "王八蛋", "滚蛋",
      "尼玛", "草泥马", "沙比", "玛德", "卧槽", "我擦", "特么", "特么的", "法克",
      "fuck", "shit", "bitch", "asshole", "bastard", "dick", "pussy", "cunt", "motherfucker"
    ];

    /* ==================== 设备码 ==================== */
    function getDeviceId() {
      let dId = localStorage.getItem('chat_device_id');
      if (!dId) {
        dId = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        localStorage.setItem('chat_device_id', dId);
      }
      return dId;
    }
    myDeviceId = getDeviceId();

    /* ==================== 在线心跳 ==================== */
    function initOnlineStatus() {
      const userStatusRef = ref(db, 'status/' + myName);
      onDisconnect(userStatusRef).remove();
      set(userStatusRef, { online: true, deviceId: myDeviceId, lastActive: Date.now(), currentGroup: "" });
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (myName) update(ref(db, 'status/' + myName), { lastActive: Date.now() });
      }, 10000);

      onValue(ref(db, 'status'), (snap) => {
        onlineUsers = [];
        if (snap.exists()) {
          const now = Date.now();
          const data = snap.val();
          for (let u in data) {
            if (data[u].online && (now - (data[u].lastActive || 0) < 15000)) {
              onlineUsers.push({ name: u, group: data[u].currentGroup || "" });
            }
          }
        }
      });
    }

    // 监听作者警告
    function listenWarnings() {
      onValue(ref(db, 'warnings/' + myName), (snap) => {
        if (snap.exists()) {
          const w = snap.val();
          if (w.active) {
            // 在页面顶部弹出一个巨大的红色警告横幅，无法忽略
            const warnDiv = document.createElement('div');
            warnDiv.id = 'author-warning';
            warnDiv.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:999999;display:flex;justify-content:center;align-items:center;flex-direction:column;padding:20px;";
            warnDiv.innerHTML = `
              <div style="background:linear-gradient(135deg, #ff3b30, #ff007f);padding:30px;border-radius:24px;max-width:340px;text-align:center;box-shadow:0 0 50px rgba(255,59,48,0.6);">
                <h1 style="color:#fff;font-size:24px;font-weight:900;margin-bottom:15px;text-shadow:0 2px 5px rgba(0,0,0,0.5);">⚠️ 作者警告</h1>
                <p style="color:#fff;font-size:16px;margin-bottom:25px;line-height:1.5;">${w.reason}</p>
                <button onclick="clearWarning('${myName}')" style="width:100%;padding:14px;background:#fff;color:#ff3b30;border:none;border-radius:14px;font-weight:bold;font-size:16px;cursor:pointer;">我已知晓，绝不再犯</button>
              </div>`;
            document.body.appendChild(warnDiv);
          } else {
            const el = document.getElementById('author-warning');
            if (el) el.remove();
          }
        }
      });
    }

    window.clearWarning = function(name) {
      update(ref(db, 'warnings/' + name), { active: false });
      const el = document.getElementById('author-warning');
      if (el) el.remove();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && myName) {
        update(ref(db, 'status/' + myName), { online: false });
      } else if (document.visibilityState === 'visible' && myName) {
        update(ref(db, 'status/' + myName), { online: true, lastActive: Date.now() });
      }
    });

    function checkIsOnline(name) {
      return onlineUsers.some(u => u.name === name);
    }

    /* ==================== 工具 ==================== */
    function parseTimeInput(input) {
      if (!input) return 0;
      input = String(input).trim().toLowerCase();
      if (input.includes('e+') || input.includes('e')) {
        const numPart = parseFloat(input.replace(/[^0-9.e+]/g, ''));
        if (isNaN(numPart)) return 0;
        if (numPart > 1e+10) return 3153600000000;
        return numPart * 24 * 60 * 60 * 1000;
      }
      let num = parseFloat(input);
      if (isNaN(num)) return 0;
      if (input.includes('m')) return num * 60 * 1000;
      if (input.includes('h')) return num * 60 * 60 * 1000;
      if (input.includes('d')) return num * 24 * 60 * 60 * 1000;
      return num * 60 * 1000;
    }

    function formatRemain(ms) {
      if (ms > 315360000000) return "永久";
      const m = Math.ceil(ms / 60000);
      if (m >= 1440) return Math.ceil(m / 1440) + " 天";
      if (m >= 60) return Math.ceil(m / 60) + " 小时";
      return m + " 分钟";
    }

    function showBanScreen() {
      document.body.innerHTML = `
        <div id="ban-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;z-index:99999;flex-direction:column;padding:20px;text-align:center;">
          <h1 style="color:#ff3b30;font-size:32px;font-weight:800;text-shadow:0 0 30px rgba(255,59,48,0.6);">🚫 数据异常，已强行下线</h1>
          <p style="color:rgba(255,255,255,0.5);margin-top:20px;font-size:14px;">该设备已被永久封禁</p>
        </div>`;
    }

    function bindDeviceBanMonitor() {
      if (banListenerBound) return;
      banListenerBound = true;
      onValue(ref(db, 'banned_devices/' + myDeviceId), (snap) => {
        if (snap.exists()) {
          const currentName = localStorage.getItem('chat_username');
          if (currentName) sessionStorage.setItem('ghost_username', currentName);
          showBanScreen();
        } else {
          if (document.getElementById('ban-screen')) {
            const ghostName = sessionStorage.getItem('ghost_username');
            if (ghostName) {
              sessionStorage.removeItem('ghost_username');
              localStorage.setItem('chat_username', ghostName);
              window.location.reload();
            } else {
              window.location.reload();
            }
          }
        }
      });
    }

    async function checkAutoLogin() {
      try {
        const devSnap = await get(ref(db, 'banned_devices/' + myDeviceId));
        if (devSnap.exists()) {
          document.documentElement.style.visibility = 'visible';
          showBanScreen();
          return;
        }
      } catch (e) {}

      const savedUser = localStorage.getItem('chat_username');
      if (savedUser) {
        try {
          const snapshot = await get(ref(db, 'users/' + savedUser));
          if (snapshot.exists()) {
            myName = savedUser;
            isAuthor = !!snapshot.val().isAuthor;
            update(ref(db, 'users/' + savedUser), { deviceId: myDeviceId }).catch(() => {});
            document.documentElement.style.visibility = 'visible';
            initOnlineStatus(); 
            listenWarnings();
            showScreen('lobbyScreen');
            renderLobby();
            return;
          } else {
            localStorage.removeItem('chat_username');
            localStorage.removeItem('chat_mygroups');
          }
        } catch (e) {}
      }
      document.documentElement.style.visibility = 'visible';
      showScreen('loginScreen');
      setupOneClickLogin();
    }

    window.onload = function () {
      checkAutoLogin();
      bindDeviceBanMonitor();

      onValue(ref(db, 'system_broadcast'), (snap) => {
        if (snap.exists()) {
          const data = snap.val();
          if (Date.now() - (data.time || 0) > 86400000) return; 
          
          if (data.action === "delete_all_users" && !sessionStorage.getItem('alerted_delete_users')) {
            sessionStorage.setItem('alerted_delete_users', 'true');
            alert("🚨 系统紧急通知：\n管理员已注销所有账号数据，请重新注册！");
            localStorage.clear();
            myDeviceId = getDeviceId();
            window.location.reload();
          }
          
          if (data.action === "global_announcement") {
            const lastRead = localStorage.getItem('last_announce_time');
            if (lastRead !== String(data.time)) {
              alert(`📢 系统更新公告\n\n${data.text}\n\n(点击确定后不再提示)`);
              localStorage.setItem('last_announce_time', String(data.time));
            }
          }
        }
      });
    };

    function setupOneClickLogin() {
      const savedUser = localStorage.getItem('chat_username');
      const btn = document.getElementById('oneClickLoginBtn');
      if (savedUser && btn) {
        btn.style.display = 'block';
        btn.innerText = `一键登录 (${savedUser})`;
      } else if (btn) {
        btn.style.display = 'none';
      }
    }

    window.doOneClickLogin = function () {
      const savedUser = localStorage.getItem('chat_username');
      if (!savedUser) return;
      get(ref(db, 'users/' + savedUser)).then((snapshot) => {
        if (snapshot.exists()) {
          myName = savedUser;
          isAuthor = !!snapshot.val().isAuthor;
          initOnlineStatus();
          listenWarnings();
          showScreen('lobbyScreen');
          renderLobby();
        } else {
          alert("该账号已被注销！");
          localStorage.removeItem('chat_username');
          setupOneClickLogin();
        }
      });
    };

    function showScreen(id) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'none';
      document.getElementById(id).style.display = 'flex';
    }

    window.loginOrRegister = function () {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (!user || !pass) return alert('账号和密码不能为空！');
      if (user.length < 2) return alert('账号至少2个字符');
      if (pass.length < 4) return alert('密码至少4位');

      get(ref(db, 'banned_devices/' + myDeviceId)).then(devSnap => {
        if (devSnap.exists()) return alert("🚫 你的设备已被永久封禁！");

        const encryptedPass = btoa(pass);
        get(ref(db, 'users/' + user)).then((snapshot) => {
          if (snapshot.exists()) {
            if (snapshot.val().password === encryptedPass) {
              myName = user;
              isAuthor = !!snapshot.val().isAuthor;
              localStorage.setItem('chat_username', myName);
              update(ref(db, 'users/' + user), { deviceId: myDeviceId });
              initOnlineStatus();
              listenWarnings();
              showScreen('lobbyScreen');
              renderLobby();
            } else {
              alert('密码错误！');
            }
          } else {
            if (confirm(`账号 "${user}" 不存在，是否注册新账号？`)) {
              get(ref(db, 'users/' + user)).then((checkSnap) => {
                if (checkSnap.exists()) {
                  alert("❌ 该用户名已被抢注，请换一个！");
                } else {
                  set(ref(db, 'users/' + user), {
                    password: encryptedPass,
                    deviceId: myDeviceId,
                    isAuthor: false
                  }).then(() => {
                    myName = user;
                    isAuthor = false;
                    localStorage.setItem('chat_username', myName);
                    initOnlineStatus();
                    listenWarnings();
                    showScreen('lobbyScreen');
                    renderLobby();
                  });
                }
              });
            }
          }
        });
      });
    };

    window.deleteAccount = function () {
      if (!confirm("⚠️ 警告：确定要注销当前账号吗？")) return;
      remove(ref(db, 'status/' + myName));
      remove(ref(db, 'users/' + myName)).then(() => {
        alert("账号已注销。");
        localStorage.clear();
        myDeviceId = getDeviceId();
        window.location.reload();
      });
    };

    let lobbyListenerBound = false;
    function renderLobby() {
      document.getElementById('myNameDisplay').innerText = myName + (isAuthor ? ' 👑' : '');

      if (lobbyListenerBound) return;
      lobbyListenerBound = true;

      onValue(ref(db, 'group_info'), (snapshot) => {
        let localGroupsSet = new Set(myGroups);
        if (snapshot.exists()) {
          const allGroups = snapshot.val();
          for (let gid in allGroups) {
            const g = allGroups[gid];
            if (g.members && g.members.includes(myName)) {
              localGroupsSet.add(gid);
            }
          }
        }
        myGroups = Array.from(localGroupsSet);
        localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));

        const listEl = document.getElementById('myGroupList');
        listEl.innerHTML = '';

        if (myGroups.length === 0) {
          listEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);margin-top:50px;font-size:14px;">你还没有加入任何群聊</div>';
          return;
        }

        myGroups.forEach(gid => {
          get(ref(db, `group_info/${gid}`)).then(snap => {
            if (snap.exists()) {
              const gName = snap.val().name || ("群聊 " + gid);
              const div = document.createElement('div');
              div.className = 'chat-item';
              div.innerHTML = `<div class="avatar">👥</div><div class="info"><div class="name">${gName}</div></div>`;
              div.onclick = () => enterChat(gid);
              listEl.appendChild(div);
            }
          });
        });
      });
    }

    window.createGroup = function () {
      const gName = prompt("请给新群聊起个名字：");
      if (!gName || gName.trim() === "") return alert("取消创建：群名不能为空！");
      const gid = Math.floor(1000 + Math.random() * 9000).toString();

      set(ref(db, 'group_info/' + gid), {
        creator: myName,
        name: gName.trim(),
        admins: [myName],
        members: [myName]
      }).then(() => {
        alert(`🎉 建群成功！\n群名：${gName}\n群号：${gid}`);
        if (!myGroups.includes(gid)) myGroups.push(gid);
        localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
        enterChat(gid);
      });
    };

    window.joinGroup = function () {
      const gid = document.getElementById('joinGroupId').value.trim();
      if (!gid) return;

      get(ref(db, 'group_info/' + gid)).then((snap) => {
        if (snap.exists()) {
          const info = snap.val();
          if (!myGroups.includes(gid)) myGroups.push(gid);
          localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));

          const members = info.members || [];
          if (!members.includes(myName)) {
            members.push(myName);
            update(ref(db, `group_info/${gid}`), { members });
          }
          enterChat(gid);
          push(ref(db, `groups/${gid}/messages`), {
            sender: "📢 系统提示",
            text: `${myName} 加入了群聊`,
            time: Date.now()
          });
        } else {
          alert("❌ 群号不存在！");
        }
      });
    };

    window.leaveGroup = function () {
      if (!confirm("确定要退出该群聊吗？")) return;
      myGroups = myGroups.filter(id => id !== currentGroupId);
      localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
      goLobby();
    };

    window.clearChatHistory = function () {
      if (!confirm("⚠️ 警告：确定要清空该群的全部聊天记录吗？\n（此操作不可恢复，且对所有成员生效）")) return;
      remove(ref(db, `groups/${currentGroupId}/messages`)).then(() => {
        alert("聊天记录已清空！");
        closeSettings();
      });
    };

    window.destroyGroup = function () {
      if (!confirm("⚠️ 警告：确定要注销并解散该群聊吗？\n所有群成员将被强制踢出，且数据无法恢复！")) return;
      remove(ref(db, 'groups/' + currentGroupId));
      remove(ref(db, 'group_info/' + currentGroupId)).then(() => {
        myGroups = myGroups.filter(id => id !== currentGroupId);
        localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
        closeSettings();
        alert("群聊已彻底注销解散。");
        goLobby();
      });
    };

    /* ==================== 聊天 ==================== */
    let chatInfoListener = null;
    let chatMsgListener = null;

    function enterChat(gid) {
      currentGroupId = gid;
      update(ref(db, 'status/' + myName), { currentGroup: gid });
      
      showScreen('chatScreen');
      document.getElementById('chatContent').innerHTML = '';

      if (chatInfoListener) { chatInfoListener(); chatInfoListener = null; }
      if (chatMsgListener) { chatMsgListener(); chatMsgListener = null; }

      const unsubInfo = onValue(ref(db, 'group_info/' + gid), (snap) => {
        if (snap.exists()) {
          currentGroupInfo = snap.val();
          document.getElementById('displayGroupName').innerText = currentGroupInfo.name || ("群 " + gid);
          
          const banner = document.getElementById('muteAllBanner');
          const isPrivileged = (myName === currentGroupInfo.creator) || (currentGroupInfo.admins && currentGroupInfo.admins.includes(myName)) || isAuthor;
          
          if (currentGroupInfo.muteAll && !isPrivileged) {
            banner.style.display = 'block';
            document.getElementById('msgInput').placeholder = "全员禁言中，无法发送消息...";
            document.getElementById('msgInput').disabled = true;
            document.getElementById('sendBtn').style.opacity = '0.5';
          } else {
            banner.style.display = 'none';
            document.getElementById('msgInput').placeholder = "输入消息...";
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendBtn').style.opacity = '1';
          }

          if (document.getElementById('settingsModal').style.display === 'flex') {
            document.getElementById('muteAllToggle').checked = !!currentGroupInfo.muteAll;
          }
        } else {
          if (currentGroupId === gid) {
            if (myGroups.includes(gid)) {
              myGroups = myGroups.filter(id => id !== gid);
              localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
              alert("该群已被强制销毁或解散！");
            }
            goLobby();
          }
        }
      });
      chatInfoListener = unsubInfo;

      const messagesRef = query(ref(db, `groups/${gid}/messages`), limitToLast(50));
      const unsubMsg = onValue(messagesRef, (snapshot) => {
        const box = document.getElementById('chatContent');
        box.innerHTML = '';
        if (snapshot.exists()) {
          snapshot.forEach((childSnapshot) => {
            const msgId = childSnapshot.key;
            const msg = childSnapshot.val();
            addMessageToUI(msgId, msg.sender, msg.text, msg.isAuthorMsg, msg.time);
          });
        }
      });
      chatMsgListener = unsubMsg;
    }

    window.goLobby = function () {
      if (chatInfoListener) { chatInfoListener(); chatInfoListener = null; }
      if (chatMsgListener) { chatMsgListener(); chatMsgListener = null; }
      currentGroupId = "";
      update(ref(db, 'status/' + myName), { currentGroup: "" });
      showScreen('lobbyScreen');
      renderLobby();
    };

    window.sendMsg = function () {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const isOwner = (myName === currentGroupInfo.creator);
      const isAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(myName);
      if (currentGroupInfo.muteAll && !isOwner && !isAdmin && !isAuthor) {
        return alert("🚫 群主开启了全员禁言，你无法发言！");
      }

      // 敏感词检测与违规上报
      let hasBadWord = false;
      for (let w of BAD_WORDS) {
        if (text.toLowerCase().includes(w.toLowerCase())) {
          hasBadWord = true;
          break;
        }
      }
      if (hasBadWord) {
        const violationRef = ref(db, 'violations/' + myName);
        get(violationRef).then(snap => {
          const currentCount = snap.exists() ? snap.val().count : 0;
          set(violationRef, { count: currentCount + 1, lastTime: Date.now(), lastWord: text });
        });
      }

      get(ref(db, 'banned/' + myName)).then((snap) => {
        if (snap.exists()) return alert("🚫 你已被全网封杀，无法发言！");

        get(ref(db, `groups/${currentGroupId}/muted/${myName}`)).then((muteSnap) => {
          if (muteSnap.exists()) {
            const until = muteSnap.val();
            if (until > Date.now()) {
              const remain = until - Date.now();
              return alert(`🚫 你已被禁言，剩余 ${formatRemain(remain)}！`);
            } else {
              remove(ref(db, `groups/${currentGroupId}/muted/${myName}`)).catch(() => {});
            }
          }

          push(ref(db, `groups/${currentGroupId}/messages`), {
            sender: myName,
            text: text,
            time: Date.now(),
            isAuthorMsg: isAuthor
          });
          input.value = '';
        });
      });
    };

    window.handleEnter = function (e) {
      if (e.key === 'Enter') sendMsg();
    };

    // ==================== 消息渲染与撤回 ====================
    function addMessageToUI(msgId, sender, text, isAuthorMsg, time) {
      if (!text) return;

      const isMe = (sender === myName);
      const isBoss = (sender === currentGroupInfo.creator);
      const isAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(sender);
      const isFromAuthor = !!isAuthorMsg;
      
      const senderOnline = checkIsOnline(sender) ? '🟢 ' : '⚪ ';

      const div = document.createElement('div');
      div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
      div.dataset.msgId = msgId;

      let nameTag = sender;
      if (isBoss) nameTag = `${senderOnline}<span style="color:#ff3b30;font-weight:bold;">👑群主</span> ${sender}`;
      else if (isAdmin) nameTag = `${senderOnline}<span style="color:#f39c12;font-weight:bold;">🛡️管理员</span> ${sender}`;
      else if (isFromAuthor) nameTag = `${senderOnline}<span style="color:#ffd700;font-weight:bold;">作者</span> ${sender}`;
      else nameTag = senderOnline + sender;

      let bubbleClass = "";
      let bubbleStyle = "";

      if (isFromAuthor) {
        bubbleClass = "author-glow";
      } else if (isAdmin && !isMe) {
        bubbleStyle = "background: linear-gradient(135deg, rgba(243,156,18,0.2), rgba(255,183,77,0.3)); border: 1px solid rgba(243,156,18,0.5); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);";
      }

      if (sender === "📢 系统公告" || sender === "📢 系统提示" || sender === "👑 作者(隐身)") {
        const isAuthorGhost = (sender === "👑 作者(隐身)");
        div.innerHTML = `
          <div class="msg-name" style="text-align:center;">${isAuthorGhost ? '作者(隐身)' : '系统公告'}</div>
          <div class="msg-text ${isAuthorGhost ? 'author-glow' : 'admin-glow'}">${text}</div>`;
      } else {
        div.innerHTML = `
          <div class="msg-name">${!isMe ? nameTag : '我'}</div>
          <div class="msg-text ${bubbleClass}" style="${bubbleStyle}">${text}</div>`;
      }

      const iAmOwner = (myName === currentGroupInfo.creator);
      const iAmAdmin = (currentGroupInfo.admins && currentGroupInfo.admins.includes(myName));
      
      let canRecall = false;
      if (!["📢 系统公告", "📢 系统提示", "👑 作者(隐身)"].includes(sender)) {
        if (isMe && (Date.now() - time <= 120000)) canRecall = true;
        else if ((iAmOwner || iAmAdmin || isAuthor) && !isFromAuthor) canRecall = true; 
      }

      if (canRecall) {
        let touchTimer;
        let isMoved = false;
        div.addEventListener('touchstart', (e) => {
          isMoved = false;
          touchTimer = setTimeout(() => {
            if (!isMoved) {
              if (confirm(`确定要撤回这条消息吗？`)) {
                remove(ref(db, `groups/${currentGroupId}/messages/${msgId}`));
              }
            }
          }, 800);
        }, { passive: true });

        div.addEventListener('touchmove', () => {
          isMoved = true;
          if (touchTimer) clearTimeout(touchTimer);
        }, { passive: true });

        div.addEventListener('touchend', () => {
          if (touchTimer) clearTimeout(touchTimer);
        });

        div.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (confirm(`确定要撤回这条消息吗？`)) {
            remove(ref(db, `groups/${currentGroupId}/messages/${msgId}`));
          }
        });
      }

      const box = document.getElementById('chatContent');
      box.appendChild(div);
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    /* ==================== 管理弹窗及群设置 ==================== */
    window.showActionModal = function (targetName) {
      actionTargetName = targetName;
      const isTargetAdmin = currentGroupInfo.admins.includes(targetName);
      const btnSetAdmin = document.getElementById('btnSetAdmin');
      btnSetAdmin.innerText = isTargetAdmin ? '撤销管理员' : '设为管理员';
      btnSetAdmin.onclick = isTargetAdmin ? removeAdminTarget : addAdminTarget;

      get(ref(db, `groups/${currentGroupId}/muted/${targetName}`)).then(muteSnap => {
        const btnMute = document.getElementById('btnMute');
        if (muteSnap.exists() && muteSnap.val() > Date.now()) {
          btnMute.innerText = '解除禁言';
          btnMute.style.background = 'rgba(52,199,89,0.2)';
          btnMute.style.color = '#34c759';
          btnMute.onclick = unmuteTarget;
        } else {
          btnMute.innerText = '禁言该用户';
          btnMute.style.background = 'rgba(255,149,0,0.2)';
          btnMute.style.color = '#ff9500';
          btnMute.onclick = muteTarget;
        }
      });

      document.getElementById('modalTargetName').innerText = targetName;
      document.getElementById('actionModal').style.display = 'flex';
    };

    window.closeActionModal = function () { document.getElementById('actionModal').style.display = 'none'; };

    window.muteTarget = function () {
      const timeStr = prompt(`禁言【${actionTargetName}】多久？\n1m / 1h / 1d / 1e+99d（永久）`);
      if (!timeStr) return;
      const ms = parseTimeInput(timeStr);
      if (ms === 0) return alert("时间格式错误！");
      set(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`), Date.now() + ms).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 被禁言 ${timeStr}`, time: Date.now() });
        closeActionModal();
      });
    };

    window.unmuteTarget = function () {
      remove(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`)).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 已被解除禁言`, time: Date.now() });
        closeActionModal();
      });
    };

    window.addAdminTarget = function () {
      if (myName !== currentGroupInfo.creator) return alert("只有群主才能设管理员！");
      const admins = currentGroupInfo.admins || [];
      if (admins.includes(actionTargetName)) return closeActionModal();
      update(ref(db, 'group_info/' + currentGroupId), { admins: [...admins, actionTargetName] }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 被设为管理员`, time: Date.now() });
        closeActionModal();
      });
    };

    window.removeAdminTarget = function () {
      if (myName !== currentGroupInfo.creator) return alert("只有群主才能撤管理员！");
      const newAdmins = currentGroupInfo.admins.filter(a => a !== actionTargetName);
      update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 被撤销管理员`, time: Date.now() });
        closeActionModal();
      });
    };

    window.kickTarget = function () {
      if (!confirm(`⚠️ 确定将【${actionTargetName}】踢出群聊吗？`)) return;
      set(ref(db, `groups/${currentGroupId}/kicked/${actionTargetName}`), true).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 已被踢出`, time: Date.now() });
        closeActionModal();
      });
    };

    window.openGroupSettings = function () {
      document.getElementById('settingsModal').style.display = 'flex';
      document.getElementById('displayGroupId').innerText = currentGroupId;
      loadMemberList();
      
      const iAmOwner = (myName === currentGroupInfo.creator);
      
      document.getElementById('muteAllSwitchBox').style.display = iAmOwner ? 'flex' : 'none';
      document.getElementById('muteAllToggle').checked = !!currentGroupInfo.muteAll;
      document.getElementById('destroyGroupBtn').style.display = iAmOwner ? 'block' : 'none';
      document.getElementById('clearHistoryBtn').style.display = iAmOwner ? 'block' : 'none';
    };

    window.closeSettings = function () { document.getElementById('settingsModal').style.display = 'none'; };
    window.toggleMuteAll = function(e) {
      const isChecked = e.target.checked;
      update(ref(db, 'group_info/' + currentGroupId), { muteAll: isChecked }).then(() => {
        push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: isChecked ? `群主开启了全员禁言` : `群主解除了全员禁言`, time: Date.now() });
      });
    };

    function loadMemberList() {
      const memberListEl = document.getElementById('memberList');
      const membersSet = new Set();
      if (currentGroupInfo.members) currentGroupInfo.members.forEach(m => membersSet.add(m));
      membersSet.add(currentGroupInfo.creator);
      membersSet.add(myName);
      memberListEl.innerHTML = '';
      const iAmOwner = (myName === currentGroupInfo.creator);

      membersSet.forEach(member => {
        const isMemberBoss = (member === currentGroupInfo.creator);
        const isMemberAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(member);
        let tag = isMemberBoss ? "👑 群主" : (isMemberAdmin ? "🛡️ 管理员" : "");
        const isOnline = checkIsOnline(member) ? "🟢" : "⚪";

        const clickAction = iAmOwner && !isMemberBoss && member !== myName ? `onclick="openMemberAction('${member}')"` : '';
        const row = document.createElement('div');
        row.style = `display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);${clickAction ? 'cursor:pointer;' : ''}`;
        row.innerHTML = `
          <div ${clickAction}><span style="font-size:12px;margin-right:5px;">${isOnline}</span><span style="font-weight:bold;color:#fff;">${member}</span><span style="font-size:12px;color:#f39c12;font-weight:bold;">${tag}</span></div>
          ${iAmOwner && !isMemberBoss && member !== myName ? '<span style="font-size:12px;color:rgba(255,255,255,0.4);">点此操作 ›</span>' : ''}`;
        memberListEl.appendChild(row);
      });
    }

    window.openMemberAction = function (member) {
      const isAdmin = currentGroupInfo.admins.includes(member);
      const action = confirm(`对【${member}】的操作：\n点击确定 = ${isAdmin ? '撤销管理员' : '设为管理员'}\n点击取消 = 踢出群聊`);
      if (action) {
        let newAdmins;
        if (isAdmin) newAdmins = currentGroupInfo.admins.filter(a => a !== member);
        else newAdmins = [...currentGroupInfo.admins, member];
        update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => {
          push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: isAdmin ? `${member} 被撤销了管理员` : `${member} 被设为管理员`, time: Date.now() });
          loadMemberList();
        });
      } else {
        if (confirm(`⚠️ 再次确认：将【${member}】踢出群聊？`)) {
          set(ref(db, `groups/${currentGroupId}/kicked/${member}`), true).then(() => {
            push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${member} 已被踢出`, time: Date.now() });
            loadMemberList();
          });
        }
      }
    };

    window.copyGroupId = function () {
      navigator.clipboard.writeText(currentGroupId).then(() => alert("群号已复制！")).catch(() => {});
    };

    /* ==================== 🎵 音乐播放器 ==================== */
    function initMusicPlayer() {
      const musicFab = document.getElementById('musicFab');
      const musicPlayer = document.getElementById('musicPlayer');
      const closeBtn = musicPlayer.querySelector('.music-close');

      musicFab.addEventListener('click', function (e) {
        e.stopPropagation();
        e.preventDefault();
        musicPlayer.classList.toggle('show');
      });

      closeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        musicPlayer.classList.remove('show');
      });

      const searchInput = document.getElementById('musicSearchInput');
      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchMusic();
        }
      });
    }

    window.searchMusic = async function () {
      const queryInput = document.getElementById('musicSearchInput');
      const query = queryInput.value.trim();
      if (!query) return;

      const listEl = document.getElementById('songList');
      listEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:12px;padding:20px;">搜索中...</div>';

      try {
        const res = await fetch(
          `https://music-api.gdstudio.xyz/api.php?types=search&source=netease&name=${encodeURIComponent(query)}&count=15&pages=1`
        );
        const data = await res.json();
        listEl.innerHTML = '';

        if (data && data.length > 0) {
          data.forEach(song => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerHTML = `
              ${song.name}
              <br>
              <span style="font-size:12px;color:rgba(255,255,255,0.5);">
                ${Array.isArray(song.artist) ? song.artist.join(' / ') : (song.artist || '未知')}
              </span>`;
            div.onclick = () => playSong(song.id, div);
            listEl.appendChild(div);
          });
        } else {
          listEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:12px;padding:20px;">没有找到相关歌曲</div>';
        }
      } catch (e) {
        console.error(e);
        listEl.innerHTML = '<div style="text-align:center;color:#ff3b30;font-size:12px;padding:20px;">搜索失败，请稍后再试</div>';
      }
    };

    window.playSong = async function (songId, itemEl) {
      document.querySelectorAll('.song-item').forEach(el => el.classList.remove('playing'));
      itemEl.classList.add('playing');

      const audio = document.getElementById('audioPlayer');
      audio.src = '';

      try {
        const res = await fetch(
          `https://music-api.gdstudio.xyz/api.php?types=url&source=netease&id=${songId}&br=320`
        );
        const data = await res.json();
        if (data && data.url) {
          audio.src = data.url;
          audio.play().catch(err => {
            console.warn('播放被阻止', err);
            alert('播放被浏览器拦截，请再次点击播放按钮');
          });
        } else {
          alert("该歌曲暂无版权或无法获取播放链接");
        }
      } catch (e) {
        alert("获取播放链接失败");
      }
    };

    document.addEventListener('DOMContentLoaded', initMusicPlayer);
  </script>

    .music-fab { position: fixed; bottom: 90px; right: 20px; width: 50px; height: 50px; background: linear-gradient(135deg, #ff0080, #7928ca); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; z-index: 2147483647; box-shadow: 0 10px 25px rgba(255,0,128,0.4); transition: transform 0.3s; user-select: none; }
    .music-fab:active { transform: scale(0.9); }
    #musicPlayer { position: fixed; bottom: -100%; left: 5%; width: 90%; max-width: 400px; background: rgba(30,30,30,0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 20px; z-index: 2147483647; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 30px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; }
    #musicPlayer.show { bottom: 20px; }
    .music-header { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: bold; }
    .music-close { background: none; border: none; color: #ff3b30; font-size: 18px; cursor: pointer; font-weight: bold; }
    .search-box { display: flex; gap: 10px; }
    .search-box input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; outline: none; font-size: 14px; }
    .search-box button { padding: 0 20px; border-radius: 12px; background: #007aff; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .song-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
    .song-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; color: #fff; font-size: 14px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05); }
    .song-item:active { background: rgba(255,255,255,0.15); }
    .song-item.playing { border-color: #007aff; color: #007aff; font-weight: bold; }
    .audio-controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    audio { width: 100%; height: 40px; filter: invert(1) hue-rotate(180deg); border-radius: 10px; outline: none; }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-box">
      <h1>Chat</h1>
      <input type="text" id="username" placeholder="账号" autocomplete="username">
      <input type="password" id="password" placeholder="密码" autocomplete="current-password">
      <button class="btn-login" onclick="loginOrRegister()" style="width:100%;padding:16px;border:none;border-radius:14px;font-weight:bold;font-size:16px;margin-bottom:15px;">登录 / 注册</button>
      <button id="oneClickLoginBtn" class="btn-one-click" onclick="doOneClickLogin()" style="width:100%;padding:16px;border:none;border-radius:14px;font-weight:bold;font-size:16px;display:none;">一键登录</button>
    </div>
  </div>

  <div id="lobbyScreen">
    <div class="lobby-header">
      <span>聊天大厅</span>
      <div>
        <span id="myNameDisplay" style="font-size:14px;color:#00c6ff;font-weight:700;"></span>
        <button class="logout-btn" onclick="deleteAccount()">注销</button>
      </div>
    </div>
    <div class="lobby-btns"><button class="btn-create" onclick="createGroup()">➕ 创建新群聊</button></div>
    <div class="btn-join-box">
      <input type="text" id="joinGroupId" placeholder="输入群号加入">
      <button onclick="joinGroup()">加入</button>
    </div>
    <div class="group-list" id="myGroupList"></div>
  </div>

  <div id="chatScreen">
    <div class="header">
      <div class="header-left">
        <button class="leave-btn" onclick="goLobby()">〈 大厅</button>
        <h1 id="displayGroupName">群聊</h1>
      </div>
      <button class="settings-btn" onclick="openGroupSettings()">⚙️</button>
    </div>
    
    <div id="muteAllBanner" style="display:none; background:linear-gradient(90deg, rgba(255,59,48,0.8), rgba(255,0,127,0.8)); color:#fff; text-align:center; padding:8px; font-size:13px; font-weight:bold; text-shadow:0 1px 2px rgba(0,0,0,0.5); flex-shrink:0;">
      ⚠️ 群主开启了全员禁言，仅群主、管理员和作者可发言
    </div>

    <div class="chat-content" id="chatContent"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="输入消息..." onkeypress="handleEnter(event)">
      <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
  </div>

  <div id="actionModal">
    <div class="action-box">
      <h3>管理 <span id="modalTargetName" style="color:#00c6ff;"></span></h3>
      <button id="btnSetAdmin" style="background:rgba(0,122,255,0.15);color:#0a84ff;border:1px solid rgba(0,122,255,0.3);"></button>
      <button id="btnMute" style="background:rgba(255,149,0,0.15);color:#ff9500;border:1px solid rgba(255,149,0,0.3);"></button>
      <button onclick="kickTarget()" style="background:rgba(255,59,48,0.15);color:#ff453a;border:1px solid rgba(255,59,48,0.3);">踢出群聊</button>
      <button class="btn-close" onclick="closeActionModal()">取消</button>
    </div>
  </div>

  <div id="settingsModal">
    <div class="modal-box">
      <h3>群聊设置</h3>
      
      <div id="muteAllSwitchBox" style="display:none; align-items:center; justify-content:space-between; background:rgba(255,59,48,0.1); padding:12px; border-radius:14px; border:1px solid rgba(255,59,48,0.3); margin-bottom:15px;">
        <div style="font-size:14px; font-weight:bold; color:#ff453a;">🚫 全员禁言</div>
        <input type="checkbox" id="muteAllToggle" onchange="toggleMuteAll(event)" style="width:20px; height:20px; accent-color:#ff3b30; cursor:pointer;">
      </div>

      <div style="background:rgba(0,0,0,0.4);padding:10px;border-radius:14px;margin-bottom:15px;text-align:center;font-size:14px;border:1px solid rgba(255,255,255,0.05);">
        群号：<strong id="displayGroupId" style="color:#00c6ff;font-size:18px;text-shadow:0 0 10px rgba(0,198,255,0.5);"></strong>
        <button onclick="copyGroupId()" style="width:auto;padding:5px 10px;margin:5px auto 0;display:block;background:rgba(0,122,255,0.2);color:#0a84ff;font-size:12px;border-radius:6px;border:1px solid rgba(0,122,255,0.3);">一键复制</button>
      </div>
      <div class="member-list">
        <h4 style="margin-bottom:10px;color:#fff;font-size:15px;text-align:left;">群成员管理</h4>
        <div id="memberList"></div>
      </div>
      
      <button id="clearHistoryBtn" onclick="clearChatHistory()" style="background:rgba(255,149,0,0.2);color:#ff9500;border:1px solid rgba(255,149,0,0.4);margin-top:20px;display:none;">🧹 清空聊天记录</button>
      <button id="destroyGroupBtn" onclick="destroyGroup()" style="background:rgba(255,59,48,0.2);color:#ff453a;border:1px solid rgba(255,59,48,0.4);margin-top:10px;display:none;">⚠️ 注销并解散群聊</button>
      <button onclick="leaveGroup()" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);margin-top:10px;">退出群聊</button>
      <button class="btn-close" onclick="closeSettings()">关闭</button>
    </div>
  </div>

  <div class="music-fab" id="musicFab">🎵</div>
  <div id="musicPlayer">
    <div class="music-header">
      <span>🎵 全网音乐搜索</span>
      <button class="music-close" onclick="document.getElementById('musicPlayer').classList.remove('show')">✕</button>
    </div>
    <div class="search-box">
      <input type="text" id="musicSearchInput" placeholder="输入歌名或歌手..." onkeypress="if(event.key==='Enter') searchMusic()">
      <button onclick="searchMusic()">搜索</button>
    </div>
    <div class="song-list" id="songList">
      <div style="text-align:center;color:rgba(255,255,255,0.4);font-size:12px;padding:20px;">输入歌名，回车搜索全网音乐</div>
    </div>
    <div class="audio-controls">
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>
</body>
</html>
