<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天室</title>
    <script>
        if (localStorage.getItem('chat_username')) {
            document.documentElement.style.visibility = 'hidden';
        }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, get, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let myDeviceId = "";
        let currentGroupId = "";
        let myGroups = JSON.parse(localStorage.getItem('chat_mygroups') || "[]"); 
        let currentGroupInfo = {};
        let actionTargetName = ""; 

        function getDeviceId() {
            let dId = localStorage.getItem('chat_device_id');
            if (!dId) {
                dId = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                localStorage.setItem('chat_device_id', dId);
            }
            return dId;
        }
        myDeviceId = getDeviceId();

        async function checkAutoLogin() {
            try {
                const devSnap = await get(ref(db, 'banned_devices/' + myDeviceId));
                if (devSnap.exists()) {
                    document.documentElement.style.visibility = 'visible';
                    document.body.innerHTML = `<div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#050505; padding:20px; text-align:center;"><h1 style="color:#ff3b30; font-size:32px; margin-bottom:20px;">🚫 设备已被永久封禁</h1></div>`;
                    return; 
                }
            } catch (e) {}

            const savedUser = localStorage.getItem('chat_username');
            if (savedUser) {
                try {
                    const snapshot = await get(ref(db, 'users/' + savedUser));
                    if (snapshot.exists()) {
                        myName = savedUser;
                        document.documentElement.style.visibility = 'visible';
                        showScreen('lobbyScreen');
                        renderLobby();
                    } else {
                        localStorage.removeItem('chat_username');
                        localStorage.removeItem('chat_mygroups');
                        document.documentElement.style.visibility = 'visible';
                        showScreen('loginScreen');
                        setupOneClickLogin(); 
                    }
                } catch (error) {
                    document.documentElement.style.visibility = 'visible';
                    showScreen('loginScreen');
                    setupOneClickLogin(); 
                }
            } else {
                document.documentElement.style.visibility = 'visible';
                showScreen('loginScreen');
                setupOneClickLogin();
            }
        }

        window.onload = function() {
            checkAutoLogin();
            onValue(ref(db, 'system_broadcast'), (snap) => {
                if(snap.exists()) {
                    const data = snap.val();
                    if (Date.now() - data.time > 10000) return;
                    if(data.action === "delete_all_users" && !sessionStorage.getItem('alerted_delete_users')) {
                        sessionStorage.setItem('alerted_delete_users', 'true'); 
                        alert("🚨 系统紧急通知：\n管理员已注销所有账号数据，请重新注册！");
                        localStorage.clear(); window.location.reload();
                    }
                    if(data.action === "global_announcement" && !sessionStorage.getItem('alerted_announce_' + data.time)) {
                        sessionStorage.setItem('alerted_announce_' + data.time, 'true');
                        alert(`📢 系统全网公告\n\n${data.text}`);
                    }
                }
            });
        }

        function setupOneClickLogin() {
            const savedUser = localStorage.getItem('chat_username');
            const btn = document.getElementById('oneClickLoginBtn');
            if (savedUser) { btn.style.display = 'block'; btn.innerText = `一键登录 (${savedUser})`; } else { btn.style.display = 'none'; }
        }

        window.doOneClickLogin = function() {
            const savedUser = localStorage.getItem('chat_username');
            if (!savedUser) return;
            get(ref(db, 'users/' + savedUser)).then((snapshot) => {
                if (snapshot.exists()) {
                    myName = savedUser; sessionStorage.removeItem('alerted_delete_users'); 
                    showScreen('lobbyScreen'); renderLobby();
                } else { alert("该账号已被注销！"); localStorage.removeItem('chat_username'); setupOneClickLogin(); }
            });
        }

        function showScreen(id) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById(id).style.display = 'flex'; 
        }

        window.loginOrRegister = function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return alert('账号和密码不能为空！');

            get(ref(db, 'banned_devices/' + myDeviceId)).then(devSnap => {
                if(devSnap.exists()) return alert("🚫 你的设备已被管理员永久封禁，无法注册或登录！");
                const encryptedPass = btoa(pass);
                get(ref(db, 'users/' + user)).then((snapshot) => {
                    if (snapshot.exists()) {
                        if (snapshot.val().password === encryptedPass) {
                            myName = user; localStorage.setItem('chat_username', myName); 
                            update(ref(db, 'users/' + user), { deviceId: myDeviceId });
                            sessionStorage.removeItem('alerted_delete_users');
                            showScreen('lobbyScreen'); renderLobby();
                        } else alert('密码错误！');
                    } else {
                        if(confirm("检测到新账号，是否注册？")) {
                            get(ref(db, 'users/' + user)).then((checkSnap) => {
                                if (checkSnap.exists()) { alert("❌ 该用户名已被抢注，请换一个！"); } 
                                else {
                                    set(ref(db, 'users/' + user), { password: encryptedPass, deviceId: myDeviceId }).then(() => {
                                        myName = user; localStorage.setItem('chat_username', myName); 
                                        sessionStorage.removeItem('alerted_delete_users');
                                        showScreen('lobbyScreen'); renderLobby();
                                    });
                                }
                            });
                        }
                    }
                });
            });
        }

        window.deleteAccount = function() {
            if(!confirm("⚠️ 警告：确定要注销当前账号吗？")) return;
            remove(ref(db, 'users/' + myName)).then(() => { alert("账号已注销。"); localStorage.clear(); window.location.reload(); });
        }

        function renderLobby() {
            document.getElementById('myNameDisplay').innerText = myName;
            const listEl = document.getElementById('myGroupList');
            listEl.innerHTML = '';
            if(myGroups.length === 0) { listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">你还没有加入任何群</div>'; return; }
            myGroups.forEach(gid => {
                get(ref(db, `group_info/${gid}`)).then(snap => {
                    if(snap.exists()) {
                        const gName = snap.val().name || ("群聊 " + gid);
                        const div = document.createElement('div');
                        div.className = 'chat-item';
                        div.innerHTML = `<div class="avatar">👥</div><div class="info"><div class="name">${gName}</div></div>`;
                        div.onclick = () => enterChat(gid);
                        listEl.appendChild(div);
                    }
                });
            });
        }

        window.createGroup = function() {
            const gName = prompt("第一步：请给新群聊起个名字：");
            if(!gName || gName.trim() === "") return alert("取消创建：群名不能为空！");
            const gid = Math.floor(1000 + Math.random() * 9000).toString();
            set(ref(db, 'group_info/' + gid), { creator: myName, name: gName.trim(), admins: [myName] }).then(() => {
                alert(`🎉 建群成功！\n群名：${gName}\n群号：${gid}`);
                if(!myGroups.includes(gid)) myGroups.push(gid);
                localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                enterChat(gid);
            });
        }

        window.joinGroup = function() {
            const gid = document.getElementById('joinGroupId').value.trim();
            if (!gid) return;
            get(ref(db, 'group_info/' + gid)).then((snap) => {
                if (snap.exists()) {
                    if(!myGroups.includes(gid)) myGroups.push(gid);
                    localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                    enterChat(gid);
                    push(ref(db, `groups/${gid}/messages`), { sender: "📢 系统提示", text: `${myName} 加入了群聊`, time: Date.now() });
                } else alert("❌ 群号不存在！");
            });
        }

        window.leaveGroup = function() {
            if(!confirm("确定要退出该群聊吗？")) return;
            myGroups = myGroups.filter(id => id !== currentGroupId);
            localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
            goLobby();
        }

        function enterChat(gid) {
            currentGroupId = gid;
            showScreen('chatScreen');
            document.getElementById('chatContent').innerHTML = '';

            onValue(ref(db, 'group_info/' + gid), (snap) => {
                if(snap.exists()) {
                    currentGroupInfo = snap.val();
                    document.getElementById('displayGroupName').innerText = currentGroupInfo.name || ("群 " + gid);
                } else {
                    if(currentGroupId === gid) {
                        if(myGroups.includes(gid)) {
                            myGroups = myGroups.filter(id => id !== gid);
                            localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                            alert("该群已被强制销毁！");
                        }
                        goLobby();
                    }
                }
            });

            const messagesRef = query(ref(db, `groups/${gid}/messages`), limitToLast(50));
            onValue(messagesRef, (snapshot) => {
                const box = document.getElementById('chatContent');
                box.innerHTML = ''; 
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => { addMessageToUI(childSnapshot.val().sender, childSnapshot.val().text); });
                }
            });
        }

        window.goLobby = function() { currentGroupId = ""; showScreen('lobbyScreen'); renderLobby(); }

        window.sendMsg = function() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            get(ref(db, 'banned/' + myName)).then((snap) => {
                if (snap.exists()) return alert("🚫 你已被全网封杀，无法发言！");
                get(ref(db, `groups/${currentGroupId}/muted/${myName}`)).then((muteSnap) => {
                    if (muteSnap.exists() && muteSnap.val() > Date.now()) {
                        // 如果禁言时间超过了 9999 年，就显示为“永久禁言”
                        const remain = muteSnap.val() - Date.now();
                        if (remain > 315360000000) return alert(`🚫 你已被永久禁言！`);
                        const left = Math.ceil(remain / 60000);
                        return alert(`🚫 你已被禁言，还剩 ${left} 分钟！`);
                    }
                    push(ref(db, `groups/${currentGroupId}/messages`), { sender: myName, text: text, time: Date.now() });
                    input.value = '';
                });
            });
        }
        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        function addMessageToUI(sender, text) {
            if (!text) return;
            const isMe = (sender === myName);
            const isBoss = (sender === currentGroupInfo.creator);
            const isAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(sender);
            
            const div = document.createElement('div');
            let nameTag = sender;
            if (isBoss) nameTag = `<span style="color:#ff3b30;font-weight:bold;">👑群主</span> ${sender}`;
            else if (isAdmin) nameTag = `<span style="color:#f39c12;font-weight:bold;">🛡️管理员</span> ${sender}`;

            if (sender === "📢 系统公告" || sender === "📢 系统提示" || sender === "👑 作者(隐身)") {
                div.className = `msg theirs`;
                div.innerHTML = `<div class="msg-name">${sender === "👑 作者(隐身)" ? '作者(隐身)' : '系统公告'}</div><div class="msg-text admin-glow">${text}</div>`;
            } else {
                div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
                let bubbleStyle = "";
                if (isAdmin && !isMe) bubbleStyle = "background: linear-gradient(135deg, #fff3e0, #ffe0b2); border: 1px solid #ffb74d;";

                const iAmOwner = (myName === currentGroupInfo.creator);
                const iAmAdmin = (currentGroupInfo.admins && currentGroupInfo.admins.includes(myName));
                const canManage = (iAmOwner || iAmAdmin) && !isMe && !isBoss;

                if (canManage) {
                    div.style.cursor = "pointer";
                    div.onclick = () => showActionModal(sender);
                }

                div.innerHTML = `
                    <div class="msg-name">${!isMe ? nameTag : '我'}</div>
                    <div class="msg-text" style="${bubbleStyle}">${text}</div>
                `;
            }
            const box = document.getElementById('chatContent');
            box.appendChild(div);
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
        }

        window.showActionModal = function(targetName) {
            actionTargetName = targetName;
            const isTargetAdmin = currentGroupInfo.admins.includes(targetName);
            
            document.getElementById('btnSetAdmin').innerText = isTargetAdmin ? '撤销管理员' : '设为管理员';
            document.getElementById('btnSetAdmin').onclick = isTargetAdmin ? removeAdminTarget : addAdminTarget;
            
            get(ref(db, `groups/${currentGroupId}/muted/${targetName}`)).then(muteSnap => {
                const btnMute = document.getElementById('btnMute');
                if (muteSnap.exists() && muteSnap.val() > Date.now()) {
                    btnMute.innerText = '解除禁言';
                    btnMute.style.background = '#07c160';
                    btnMute.onclick = unmuteTarget;
                } else {
                    btnMute.innerText = '禁言该用户';
                    btnMute.style.background = '#f39c12';
                    btnMute.onclick = muteTarget;
                }
            });

            document.getElementById('modalTargetName').innerText = targetName;
            document.getElementById('actionModal').style.display = 'flex';
        }

        // 🌟 科学记数法时间解析引擎
        window.parseTimeInput = function(input) {
            if (!input) return 0;
            input = input.trim().toLowerCase();
            
            // 如果包含 e+99，或者 e 且后面数字大于 30，说明是天文数字，直接返回 100 年（作为永久）
            if (input.includes('e+') || input.includes('e')) {
                const numPart = parseFloat(input.replace(/[^0-9.e+]/g, ''));
                if (isNaN(numPart)) return 3153600000000; // 默认 100 年
                if (numPart > 1e+10) return 3153600000000; // 如果超过 100 亿，直接按永久算
            }

            let num = parseFloat(input);
            if (isNaN(num)) num = 0;
            
            if (input.includes('m')) return num * 60 * 1000;
            if (input.includes('h')) return num * 60 * 60 * 1000;
            if (input.includes('d')) return num * 24 * 60 * 60 * 1000;
            return num * 60 * 1000; 
        }

        window.muteTarget = function() {
            const timeStr = prompt(`禁言【${actionTargetName}】多久？\n支持格式：1m(分钟), 1h(小时), 1d(天)\n可输入无限大，例如: 1e+99d (相当于永久禁言)`);
            if(!timeStr) return;
            
            const ms = parseTimeInput(timeStr);
            if (ms === 0) return alert("时间格式错误！");

            const muteUntil = Date.now() + ms;
            set(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`), muteUntil).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 被禁言 ${timeStr}`, time: Date.now() });
                closeActionModal();
            });
        }

        window.unmuteTarget = function() {
            remove(ref(db, `groups/${currentGroupId}/muted/${actionTargetName}`)).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 已被解除禁言`, time: Date.now() });
                closeActionModal();
            });
        }

        window.addAdminTarget = function() {
            if (myName !== currentGroupInfo.creator) return alert("只有群主才能设管理员！");
            update(ref(db, 'group_info/' + currentGroupId), { admins: [...currentGroupInfo.admins, actionTargetName] }).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 被设为管理员`, time: Date.now() });
                closeActionModal();
            });
        }

        window.removeAdminTarget = function() {
            if (myName !== currentGroupInfo.creator) return alert("只有群主才能撤管理员！");
            const newAdmins = currentGroupInfo.admins.filter(a => a !== actionTargetName);
            update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 被撤销管理员`, time: Date.now() });
                closeActionModal();
            });
        }

        window.kickTarget = function() {
            if(!confirm(`⚠️ 确定将【${actionTargetName}】踢出群聊吗？`)) return;
            set(ref(db, `groups/${currentGroupId}/kicked/${actionTargetName}`), true).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${actionTargetName} 已被踢出`, time: Date.now() });
                closeActionModal();
            });
        }

        window.closeActionModal = function() {
            document.getElementById('actionModal').style.display = 'none';
        }

        window.copyGroupId = function() { navigator.clipboard.writeText(currentGroupId).then(() => { alert("群号已复制！"); }); }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: #ededed; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #loginScreen, #lobbyScreen, #chatScreen { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
        #loginScreen { background: #fff; justify-content: center; align-items: center; }
        .lobby-header { background: #ededed; padding: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-shrink: 0;}
        .logout-btn { background: none; border: none; color: #ff3b30; font-size: 14px; cursor: pointer; }
        .lobby-btns { padding: 20px; display: flex; gap: 10px; background: #fff; border-bottom: 8px solid #ededed; flex-shrink: 0;}
        .lobby-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; background: #007aff; color: white;}
        .btn-join-box { display: flex; gap: 10px; padding: 20px; background: #fff; flex-shrink: 0;}
        .btn-join-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none;}
        .btn-join-box button { padding: 0 20px; background: #07c160; color: white; border: none; border-radius: 8px; font-weight: bold;}
        .group-list { flex: 1; overflow-y: auto; background: #fff; -webkit-overflow-scrolling: touch;}
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .avatar { width: 50px; height: 50px; border-radius: 8px; background: #07c160; display: flex; justify-content: center; align-items: center; font-size: 24px; margin-right: 15px; }
        .info .name { font-size: 17px; font-weight: 500; }
        .header { background: #ededed; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-shrink: 0;}
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header h1 { font-size: 18px; color: #000; margin: 0;}
        .leave-btn { background: none; border: none; color: #007aff; font-size: 16px; cursor: pointer; }
        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; -webkit-overflow-scrolling: touch; }
        .msg { display: flex; flex-direction: column; max-width: 80%; }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-name { font-size: 12px; color: #888; margin-bottom: 5px; }
        .msg-text { padding: 12px 16px; border-radius: 12px; font-size: 16px; line-height: 1.4; word-break: break-all; transition: background 0.2s;}
        .msg.theirs .msg-text:hover { background: #e5e5e5; }
        .msg.mine .msg-text { background: #95ec69; color: #000; border-top-right-radius: 2px; }
        .msg.theirs .msg-text { background: #fff; color: #000; border-top-left-radius: 2px; }
        .admin-glow { background: linear-gradient(135deg, #ff3b30, #ff007f) !important; color: #fff !important; font-weight: bold; box-shadow: 0 0 15px rgba(255, 59, 48, 0.8), 0 0 30px rgba(255, 0, 127, 0.5) !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 10px rgba(255, 59, 48, 0.6); } 50% { box-shadow: 0 0 20px rgba(255, 59, 48, 1); } 100% { box-shadow: 0 0 10px rgba(255, 59, 48, 0.6); } }
        .input-area { padding: 15px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; gap: 10px; flex-shrink: 0; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #fff; outline: none; font-size:16px;}
        .input-area button { padding: 0 25px; border-radius: 8px; background: #07c160; color: white; border: none; font-weight: bold; font-size:16px;}

        #actionModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
        .action-box { background: #fff; width: 80%; max-width: 300px; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .action-box h3 { text-align: center; margin-bottom: 5px; color: #333; }
        .action-box button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-close { background: #eee; color: #333; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <h1 style="color:#07c160; margin-bottom:30px;">聊天室</h1>
        <input type="text" id="username" placeholder="输入账号" style="width:100%; max-width:300px; padding:15px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; outline:none; font-size:16px;">
        <input type="password" id="password" placeholder="输入密码" style="width:100%; max-width:300px; padding:15px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; outline:none; font-size:16px;">
        <button onclick="loginOrRegister()" style="width:100%; max-width:300px; padding:15px; background:#07c160; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px; margin-bottom: 15px;">登录 / 注册</button>
        <button id="oneClickLoginBtn" onclick="doOneClickLogin()" style="width:100%; max-width:300px; padding:15px; background:#f0f0f0; color:#07c160; border:1px solid #07c160; border-radius:8px; font-weight:bold; font-size:16px; display:none;">一键登录</button>
    </div>

    <div id="lobbyScreen">
        <div class="lobby-header">
            <span>聊天大厅</span>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="myNameDisplay" style="font-size:14px; color:#07c160;"></span>
                <button class="logout-btn" onclick="deleteAccount()">注销</button>
            </div>
        </div>
        <div class="lobby-btns"><button class="btn-create" onclick="createGroup()">➕ 创建新群聊</button></div>
        <div class="btn-join-box"><input type="text" id="joinGroupId" placeholder="输入群号加入"><button onclick="joinGroup()">加入</button></div>
        <div class="group-list" id="myGroupList"></div>
    </div>

    <div id="chatScreen">
        <div class="header">
            <div class="header-left"><button class="leave-btn" onclick="goLobby()">〈 大厅</button><h1 id="displayGroupName">群聊</h1></div>
        </div>
        <div class="chat-content" id="chatContent"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="输入消息..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <!-- 操作弹窗 -->
    <div id="actionModal">
        <div class="action-box">
            <h3>对 <span id="modalTargetName" style="color:#007aff;"></span> 操作</h3>
            <button id="btnSetAdmin" style="background: #007aff; color: white;"></button>
            <button id="btnMute" style="background: #f39c12; color: white;"></button>
            <button onclick="kickTarget()" style="background: #ff3b30; color: white;">踢出群聊</button>
            <button class="btn-close" onclick="closeActionModal()">取消</button>
        </div>
    </div>
</body>
</html>
