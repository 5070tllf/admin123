<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3B班聊天室</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue, query, limitToLast, get, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let currentGroupId = "";
        let myGroups = JSON.parse(localStorage.getItem('chat_mygroups') || "[]"); // 记住自己加过的群
        let chatRef = null;
        let currentGroupInfo = {};

        window.onload = function() {
            const savedUser = localStorage.getItem('chat_username');
            if (savedUser) {
                myName = savedUser;
                showScreen('lobbyScreen');
                renderLobby();
            } else {
                showScreen('loginScreen');
            }
        }

        function showScreen(id) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById(id).style.display = 'flex';
        }

        // 登录/注册
        window.loginOrRegister = function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return alert('账号和密码不能为空！');

            const encryptedPass = btoa(pass);
            get(ref(db, 'users/' + user)).then((snapshot) => {
                if (snapshot.exists()) {
                    if (snapshot.val().password === encryptedPass) {
                        myName = user;
                        localStorage.setItem('chat_username', myName);
                        showScreen('lobbyScreen');
                        renderLobby();
                    } else alert('密码错误！');
                } else {
                    if(confirm("检测到新账号，是否注册？")) {
                        set(ref(db, 'users/' + user), { password: encryptedPass }).then(() => {
                            myName = user;
                            localStorage.setItem('chat_username', myName);
                            showScreen('lobbyScreen');
                            renderLobby();
                        });
                    }
                }
            });
        }

        // 渲染大厅（我的群列表）
        function renderLobby() {
            document.getElementById('myNameDisplay').innerText = myName;
            const listEl = document.getElementById('myGroupList');
            listEl.innerHTML = '';

            if(myGroups.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">你还没有加入任何群</div>';
                return;
            }

            myGroups.forEach(gid => {
                get(ref(db, `group_info/${gid}`)).then(snap => {
                    if(snap.exists()) {
                        const gName = snap.val().name || ("群聊 " + gid);
                        const div = document.createElement('div');
                        div.className = 'chat-item';
                        div.innerHTML = `<div class="avatar">👥</div><div class="info"><div class="name">${gName}</div></div>`;
                        div.onclick = () => enterChat(gid);
                        listEl.appendChild(div);
                    }
                });
            });
        }

        // 建群
        window.createGroup = function() {
            const gid = Math.floor(1000 + Math.random() * 9000).toString();
            const gName = prompt("给群聊起个名字：", myName + "的群聊");
            if(gName === null) return;

            set(ref(db, 'group_info/' + gid), { creator: myName, name: gName, admins: [myName] }).then(() => {
                alert("建群成功！群号：" + gid);
                if(!myGroups.includes(gid)) myGroups.push(gid);
                localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                enterChat(gid);
            });
        }

        // 加群（带验证）
        window.joinGroup = function() {
            const gid = document.getElementById('joinGroupId').value.trim();
            if (!gid) return;
            get(ref(db, 'group_info/' + gid)).then((snap) => {
                if (snap.exists()) {
                    if(!myGroups.includes(gid)) myGroups.push(gid);
                    localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                    enterChat(gid);
                } else alert("❌ 群号不存在！");
            });
        }

        // 进入聊天室
        function enterChat(gid) {
            currentGroupId = gid;
            showScreen('chatScreen');
            document.getElementById('chatContent').innerHTML = '';

            // 监听群资料（名字、管理员列表）
            onValue(ref(db, 'group_info/' + gid), (snap) => {
                if(snap.exists()) {
                    currentGroupInfo = snap.val();
                    document.getElementById('displayGroupName').innerText = currentGroupInfo.name || ("群 " + gid);
                }
            });

            // 监听消息
            chatRef = query(ref(db, `groups/${gid}`), limitToLast(50));
            onChildAdded(chatRef, (snapshot) => {
                addMessageToUI(snapshot.val().sender, snapshot.val().text);
            });
        }

        // 返回大厅
        window.goLobby = function() {
            currentGroupId = "";
            showScreen('lobbyScreen');
            renderLobby();
        }

        // 发送消息（带封禁和禁言检测）
        window.sendMsg = function() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text) return;

            // 检查被封禁
            get(ref(db, 'banned/' + myName)).then((snap) => {
                if (snap.exists()) return alert("你已被全网封杀！");
                
                // 检查是否被禁言
                get(ref(db, `groups/${currentGroupId}/muted/${myName}`)).then((muteSnap) => {
                    if (muteSnap.exists() && muteSnap.val() > Date.now()) {
                        const left = Math.ceil((muteSnap.val() - Date.now()) / 60000);
                        return alert(`你已被禁言，还剩 ${left} 分钟！`);
                    }
                    push(ref(db, `groups/${currentGroupId}/messages`), { sender: myName, text: text, time: Date.now() });
                    document.getElementById('msgInput').value = '';
                });
            });
        }

        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        // 渲染消息
        function addMessageToUI(sender, text) {
            if (!text) return;
            const isMe = (sender === myName);
            const isAdmin = sender === "📢 系统管理员";
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
            if(isAdmin) div.className = 'msg theirs admin-msg';

            div.innerHTML = `<div class="msg-name">${!isMe ? sender : '我'}</div><div class="msg-text">${text}</div>`;
            const box = document.getElementById('chatContent');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // ================= 群设置与管理员功能 =================
        window.openGroupSettings = function() {
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('newGroupName').value = currentGroupInfo.name || "";
        }
        window.closeSettings = function() { document.getElementById('settingsModal').style.display = 'none'; }

        // 修改群名（群主和管理员可用）
        window.changeGroupName = function() {
            if (!currentGroupInfo.admins.includes(myName)) return alert("只有群主或管理员才能修改群名！");
            const newName = document.getElementById('newGroupName').value.trim();
            if(!newName) return;
            update(ref(db, 'group_info/' + currentGroupId), { name: newName }).then(() => {
                alert("群名修改成功！");
                closeSettings();
            });
        }

        // 设置管理员（仅群主可用）
        window.addAdmin = function() {
            if (currentGroupInfo.creator !== myName) return alert("只有群主才能设置管理员！");
            const newAdmin = document.getElementById('newAdminName').value.trim();
            if(!newAdmin) return;
            if(currentGroupInfo.admins.includes(newAdmin)) return alert("该玩家已经是管理员了！");
            
            const newAdmins = [...currentGroupInfo.admins, newAdmin];
            update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => {
                alert(newAdmin + " 已被设为管理员！");
            });
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #ededed; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 登录 & 大厅 */
        #loginScreen, #lobbyScreen { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .lobby-header { background: #ededed; padding: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd;}
        .lobby-btns { padding: 20px; display: flex; gap: 10px; background: #fff; border-bottom: 8px solid #ededed;}
        .lobby-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;}
        .btn-create { background: #007aff; color: white; }
        .btn-join-box { display: flex; gap: 10px; padding: 20px; background: #fff;}
        .btn-join-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none;}
        .btn-join-box button { padding: 0 20px; background: #07c160; color: white; border: none; border-radius: 8px; font-weight: bold;}

        .group-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .chat-item:active { background: #e5e5e5; }
        .avatar { width: 50px; height: 50px; border-radius: 8px; background: #07c160; display: flex; justify-content: center; align-items: center; font-size: 24px; margin-right: 15px; }
        .info .name { font-size: 17px; font-weight: 500; }

        /* 聊天界面 */
        #chatScreen { display: none; flex: 1; flex-direction: column; min-height: 0; }
        .header { background: #ededed; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header h1 { font-size: 18px; color: #000; margin: 0;}
        .leave-btn { background: none; border: none; color: #007aff; font-size: 16px; cursor: pointer; }
        .settings-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        
        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; flex-direction: column; max-width: 80%; }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-name { font-size: 12px; color: #888; margin-bottom: 5px; }
        .msg-text { padding: 12px 16px; border-radius: 12px; font-size: 16px; line-height: 1.4; word-break: break-all;}
        .msg.mine .msg-text { background: #95ec69; color: #000; border-top-right-radius: 2px; }
        .msg.theirs .msg-text { background: #fff; color: #000; border-top-left-radius: 2px; }
        .admin-msg .msg-text { background: #ff3b30; color: white; font-weight: bold;}
        
        .input-area { padding: 15px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #fff; outline: none; }
        .input-area button { padding: 0 25px; border-radius: 8px; background: #07c160; color: white; border: none; font-weight: bold; }

        /* 设置弹窗 */
        #settingsModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-box { background: #fff; width: 80%; max-width: 300px; padding: 20px; border-radius: 12px; }
        .modal-box h3 { margin-bottom: 15px; text-align: center; }
        .modal-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; outline: none;}
        .modal-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="loginScreen">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px;">
            <h1 style="color:#07c160; margin-bottom:30px;">3B班聊天室</h1>
            <input type="text" id="username" placeholder="输入账号" style="width:100%; max-width:300px; padding:15px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px;">
            <input type="password" id="password" placeholder="输入密码" style="width:100%; max-width:300px; padding:15px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px;">
            <button onclick="loginOrRegister()" style="width:100%; max-width:300px; padding:15px; background:#07c160; color:white; border:none; border-radius:8px; font-weight:bold;">登录 / 注册</button>
        </div>
    </div>

    <!-- 大厅页（微信群聊列表风格） -->
    <div id="lobbyScreen" style="display: none;">
        <div class="lobby-header">
            <span>聊天大厅</span>
            <span id="myNameDisplay" style="font-size:14px; color:#07c160;"></span>
        </div>
        <div class="lobby-btns">
            <button class="btn-create" onclick="createGroup()">➕ 创建新群聊</button>
        </div>
        <div class="btn-join-box">
            <input type="text" id="joinGroupId" placeholder="输入群号加入">
            <button onclick="joinGroup()">加入</button>
        </div>
        <div class="group-list" id="myGroupList"></div>
    </div>

    <!-- 聊天页 -->
    <div id="chatScreen">
        <div class="header">
            <div class="header-left">
                <button class="leave-btn" onclick="goLobby()">〈 大厅</button>
                <h1 id="displayGroupName">群聊</h1>
            </div>
            <button class="settings-btn" onclick="openGroupSettings()">⚙️</button>
        </div>
        <div class="chat-content" id="chatContent"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="输入消息..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <!-- 群设置弹窗 -->
    <div id="settingsModal">
        <div class="modal-box">
            <h3>群聊设置</h3>
            <input type="text" id="newGroupName" placeholder="修改群名称">
            <button onclick="changeGroupName()" style="background: #007aff; color: white;">保存群名</button>
            
            <input type="text" id="newAdminName" placeholder="输入账号设置管理员">
            <button onclick="addAdmin()" style="background: #f39c12; color: white;">设为管理员</button>
            
            <button onclick="closeSettings()" style="background: #eee; color: #333; margin-top: 5px;">取消</button>
        </div>
    </div>
</body>
</html>
