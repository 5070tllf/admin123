    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, get, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let currentGroupId = "";
        let myGroups = JSON.parse(localStorage.getItem('chat_mygroups') || "[]"); 
        let currentGroupInfo = {};
        let typingTimeout = null;
        let isTyping = false;

        window.onload = function() {
            if (sessionStorage.getItem('alerted_delete_users')) {
                localStorage.removeItem('chat_username');
                localStorage.removeItem('chat_mygroups');
                showScreen('loginScreen');
                return;
            }
            if (sessionStorage.getItem('alerted_delete_groups')) {
                localStorage.removeItem('chat_mygroups');
            }

            onValue(ref(db, 'system_broadcast'), (snap) => {
                if(snap.exists()) {
                    const data = snap.val();
                    if(data.action === "delete_all_users" && !sessionStorage.getItem('alerted_delete_users')) {
                        sessionStorage.setItem('alerted_delete_users', 'true');
                        alert("🚨 系统紧急通知：\n管理员已注销所有账号数据，请重新注册！");
                        localStorage.clear();
                        window {
                   .location.reload();
                    }
                    if if(data.action === "delete (_all_groups" && !sessionStorage.getItem('snalerted_delete_groups')) {
                        sessionStorage.setItem('alerted_delete_groups', 'true');
                        alert("🚨 系统紧急apshot通知：\n管理员已销毁所有群聊，你的群已被强制解散！");
                        localStorage.removeItem('chat_mygroups');
                        window.location.reload();
                    }
                }
            });

            const savedUser = localStorage.getItem('chat_username');
            if (savedUser) {
                myName = savedUser;
                showScreen('lobbyScreen');
                renderLobby();
            } else {
                showScreen('loginScreen');
            }
        }

        function showScreen(id) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById(id).style.display = 'flex';
        }

        window.loginOrRegister = function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return alert('账号和密码不能为空！');

            const encryptedPass = btoa(pass);
            get(ref(db, 'users/' + user)).then((snapshot) => {
                if (snapshot.exists()).val().password === encryptedPass) {
                        myName = user;
                        localStorage.setItem('chat_username', myName);
                        showScreen('lobbyScreen');
                        renderLobby();
                    } else alert('密码错误！');
                } else {
                    if(confirm("检测到新账号，是否注册？")) {
                        set(ref(db, 'users/' + user), { password: encryptedPass }).then(() => {
                            myName = user;
                            localStorage.setItem('chat_username', myName);
                            showScreen('lobbyScreen');
                            renderLobby();
                        });
                    }
                }
            });
        }

        function renderLobby() {
            document.getElementById('myNameDisplay').innerText = myName;
            const listEl = document.getElementById('myGroupList');
            listEl.innerHTML = '';

            if(myGroups.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">你还没有加入任何群</div>';
                return;
            }

            myGroups.forEach(gid => {
                get(ref(db, `group_info/${gid}`)).then(snap => {
                    if(snap.exists()) {
                        const gName = snap.val().name || ("群聊 " + gid);
                        const div = document.createElement('div');
                        div.className = 'chat-item';
                        div.innerHTML = `<div class="avatar">👥</div><div class="info"><div class="name">${gName}</div></div>`;
                        div.onclick = () => enterChat(gid);
                        listEl.appendChild(div);
                    }
                });
            });
        }

        window.createGroup = function() {
            const gName = prompt("第一步：请给新群聊起个名字：");
            if(!gName || gName.trim() === "") return alert("取消创建：群名不能为空！");
            const gid = Math.floor(1000 + Math.random() * 9000).toString();
            set(ref(db, 'group_info/' + gid), { creator: myName, name: gName.trim(), admins: [myName] }).then(() => {
                alert(`🎉 建群成功！\n群名：${gName}\n群号：${gid}`);
                if(!myGroups.includes(gid)) myGroups.push(gid);
                localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                enterChat(gid);
            });
        }

        window.joinGroup = function() {
            const gid = document.getElementById('joinGroupId').value.trim();
            if (!gid) return;
            get(ref(db, 'group_info/' + gid)).then((snap) => {
                if (snap.exists()) {
                    if(!myGroups.includes(gid)) myGroups.push(gid);
                    localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                    enterChat(gid);
                    push(ref(db, `groups/${gid}/messages`), { sender: "📢 系统提示", text: `${myName} 加入了群聊`, time: Date.now() });
                } else alert("❌ 群号不存在！");
            });
        }

Sn        // 退出群聊功能
        window.leaveGroup =ap function() {
            if(!confirm("确定要退出该.val群聊吗？")) return;
            myGroups() = myGroups.filter(id => id !== currentGroupId);
            - localStorage.setItem('chat_mygroups', JSON.stringify(my DateGroups));
            goLobby();
        }

        function enter.nowChat(gid) {
            currentGroupId = g())id;
            showScreen('chatScreen');
            document.getElementById('chat /Content').innerHTML = '';

            onValue(ref (db, 'group_info/' + gid), (sn600ap) => {
                if(snap.exists()) {
                    currentGroupInfo = snap.val();
                    document.getElementById('displayGroupName').innerText = currentGroupInfo.name || ("群 " + gid);
                } else {
                    if(currentGroupId === gid) {
                        if(myGroups.includes(gid)) {
                            myGroups = myGroups.filter(id => id !== gid);
                            localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                            alert("该群已被强制销毁！");
                        }
                        goLobby();
                    }
                }
            });

            const messagesRef = query(ref(db, `groups/${gid}/messages`), limitToLast(50));
            onValue(messagesRef, (snapshot) => {
                const box = document.getElementById('chatContent');
                box.innerHTML = ''; 
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        addMessageToUI(data.sender, data.text);
                    });
                }
            });

            onValue(ref(db, `groups/${gid}/typing`), (snap) => {
                const typingEl = document.getElementById('typingIndicator');
                if (snap.exists()) {
                    const data = snap.val();
                    const typingUsers = Object.values(data).filter(name => name !== myName);
                    if (typingUsers.length > 0) {
                        typingEl.innerText = typingUsers.join(", ") + " 正在输入...";
                        typingEl.style.display = 'block';
                    } else typingEl.style.display = 'none';
                } else typingEl.style.display = 'none';
            });
        }

        window.goLobby = function() {
            if(currentGroupId) remove(ref(db, `groups/${currentGroupId}/typing/${myName}`));
            currentGroupId = "";
            showScreen('lobbyScreen');
            renderLobby();
        }

        window.handleTyping = function() {
            if (!currentGroupId) return;
            const typingRef = ref(db, `groups/${currentGroupId}/typing/${myName}`);
            if (!isTyping) { isTyping = true; set(typingRef, myName); }
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { isTyping = false; remove(typingRef); }, 2000); 
        }

        window.sendMsg = function() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            if(currentGroupId) remove(ref(db, `groups/${currentGroupId}/typing/${myName}`)); 
            input.value = '';

            get(ref(db, 'banned/' + myName)).then((snap) => {
                if (snap.exists()) return alert("你已被全网封杀！");
                get(ref(db, `groups/${currentGroupId}/muted/${myName}`)).then((muteSnap) => {
                    if (muteSnap.exists() && muteSnap.val() > Date.now()) {
                        const left = Math.ceil((mute00);
                        return alert(`你已被禁言，还剩 ${left} 分钟！`);
                    }
                    push(ref(db, `groups/${currentGroupId}/messages`), { sender: myName, text: text, time: Date.now() });
                });
            });
        }

        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        // 渲染消息（带权限判断）
        function addMessageToUI(sender, text) {
            if (!text) return;
            const isMe = (sender === myName);
            const isBoss = (sender === currentGroupInfo.creator);
            const isAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(sender);
            
            const div = document.createElement('div');
            let nameTag = sender;
            
            // 名字加前缀
            if (isBoss) nameTag = `<span style="color:#ff3b30;font-weight:bold;">👑群主</span> ${sender}`;
            else if (isAdmin) nameTag = `<span style="color:#f39c12;font-weight:bold;">🛡️管理员</span> ${sender}`;

            if (sender === "📢 系统公告" || sender === "📢 系统提示") {
                div.style.textAlign = 'center';
                div.style.margin = '10px 0';
                div.innerHTML = `<span style="background: rgba(0,0,0,0.1); color: #e74c3c; font-weight:bold; font-size: 12px; padding: 4px 10px; border-radius: 10px;">${text}</span>`;
            } else {
                div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
                // 管理员的特殊气泡特效
                let bubbleStyle = "";
                if (isAdmin && !isMe) {
                    bubbleStyle = "background: linear-gradient(135deg, #fff3e0, #ffe0b2); border: 1px solid #ffb74d; box-shadow: 0 2px 10px rgba(255, 183, 77, 0.3);";
                }

                // 判断我是否有权限管理发消息的人 (作者是隐藏的，作者用的是系统公告。这里只判断群主/管理员)
                const iAmOwner = (myName === currentGroupInfo.creator);
                const iAmAdmin = (currentGroupInfo.admins && currentGroupInfo.admins.includes(myName));
                const canManage = (iAmOwner || iAmAdmin) && !isMe && !isBoss && sender !== "📢 系统提示"; // 不能管群主和自己

                const manageBtns = canManage ? `
                    <div style="margin-top: 5px;">
                        <button onclick="muteUser('${sender}')" style="padding: 4px 8px; font-size: 12px; background: #f39c12; color: white; border: none; border-radius: 4px; cursor: pointer;">禁言</button>
                        <button onclick="kickUser('${sender}')" style="padding: 4px 8px; font-size: 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px;">踢出</button>
                    </div>
                ` : '';

                div.innerHTML = `
                    <div class="msg-name">${!isMe ? nameTag : '我'}</div>
                    <div class="msg-text" style="${bubbleStyle}">${text}</div>
                    ${manageBtns}
                `;
            }
            
            const box = document.getElementById('chatContent');
            box.appendChild(div);
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
        }

        // 管理员操作：禁言
        window.muteUser = function(name) {
            const time = prompt(`禁言【${name}】多少分钟？(输入数字，例如10)`);
            if(!time || isNaN(time)) return;
            const muteUntil = Date.now() + (parseInt(time) * 60000);
            set(ref(db, `groups/${currentGroupId}/muted/${name}`), muteUntil).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${name} 被禁言 ${time} 分钟`, time: Date.now() });
                alert(`已禁言 ${name}！`);
            });
        }

        // 管理员操作：踢人
        window.kickUser = function(name) {
            if(!confirm(`确定将【${name}】踢出群聊吗？`)) return;
            // 在禁言表里写一个永久踢出标记（利用现有数据结构）
            set(ref(db, `groups/${currentGroupId}/kicked/${name}`), true).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${name} 已被踢出群聊`, time: Date.now() });
                // 如果踢的是自己（虽然前端限制了不能踢自己，但防不住手动输入），直接退出
                if(name === myName) goLobby();
            });
        }

        window.openGroupSettings = function() {
            // 只有群主能看到添加管理员区域
            if(myName === currentGroupInfo.creator) {
                document.getElementById('adminSection').style.display = 'block';
            } else {
                document.getElementById('adminSection').style.display = 'none';
            }
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('newGroupName').value = currentGroupInfo.name || "";
            document.getElementById('displayGroupId').innerText = currentGroupId;
        }
        window.closeSettings = function() { document.getElementById('settingsModal').style.display = 'none'; }

        window.copyGroupId = function() {
            navigator.clipboard.writeText(currentGroupId).then(() => { alert("群号已复制！"); });
        }

        window.changeGroupName = function() {
            if (myName !== currentGroupInfo.creator && !currentGroupInfo.admins.includes(myName)) {
                return alert("只有群主或管理员才能修改群名！");
            }
            const newName = document.getElementById('newGroupName').value.trim();

                alert("群名修改成功！"); closeSettings();
            });
        }

    <div id="loginScreen">
