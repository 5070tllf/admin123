<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <titl>聊天室</title>
    <script>
        if (localStorage.getItem('chat_username')) {
            document.documentElement.style.visibility = 'hidden';
        }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, get, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let myDeviceId = "";
        let currentGroupId = "";
        let myGroups = JSON.parse(localStorage.getItem('chat_mygroups') || "[]"); 
        let currentGroupInfo = {};
        let typingTimeout = null;
        let isTyping = false;

        function getDeviceId() {
            let dId = localStorage.getItem('chat_device_id');
            if (!dId) {
                dId = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                localStorage.setItem('chat_device_id', dId);
            }
            return dId;
        }
        myDeviceId = getDeviceId();

        async function checkAutoLogin() {
            const savedUser = localStorage.getItem('chat_username');
            if (savedUser) {
                try {
                    const devSnap = await get(ref(db, 'banned_devices/' + myDeviceId));
                    if (devSnap.exists()) {
                        localStorage.clear();
                        document.documentElement.style.visibility = 'visible';
                        document.body.innerHTML = `<div style="padding:50px; text-align:center; color:red; font-weight:bold;">🚫 该设备已被永久封禁，无法访问。</div>`;
                        return;
                    }

                    const snapshot = await get(ref(db, 'users/' + savedUser));
                    if (snapshot.exists()) {
                        myName = savedUser;
                        document.documentElement.style.visibility = 'visible';
                        showScreen('lobbyScreen');
                        renderLobby();
                    } else {
                        localStorage.removeItem('chat_username');
                        localStorage.removeItem('chat_mygroups');
                        document.documentElement.style.visibility = 'visible';
                        showScreen('loginScreen');
                        setupOneClickLogin(); 
                    }
                } catch (error) {
                    document.documentElement.style.visibility = 'visible';
                    showScreen('loginScreen');
                    setupOneClickLogin(); 
                }
            } else {
                document.documentElement.style.visibility = 'visible';
                showScreen('loginScreen');
                setupOneClickLogin();
            }
        }

        window.onload = function() {
            checkAutoLogin();

            onValue(ref(db, 'system_broadcast'), (snap) => {
                if(snap.exists()) {
                    const data = snap.val();
                    if (Date.now() - data.time > 10000) return;

                    if(data.action === "delete_all_users" && !sessionStorage.getItem('alerted_delete_users')) {
                        sessionStorage.setItem('alerted_delete_users', 'true'); 
                        alert("🚨 系统紧急通知：\n管理员已注销所有账号数据，请重新注册！");
                        localStorage.clear();
                        window.location.reload();
                    }
                }
            });
        }

        function setupOneClickLogin() {
            const savedUser = localStorage.getItem('chat_username');
            const btn = document.getElementById('oneClickLoginBtn');
            if (savedUser) {
                btn.style.display = 'block';
                btn.innerText = `一键登录 (${savedUser})`;
            } else {
                btn.style.display = 'none';
            }
        }

        window.doOneClickLogin = function() {
            const savedUser = localStorage.getItem('chat_username');
            if (!savedUser) return;
            get(ref(db, 'users/' + savedUser)).then((snapshot) => {
                if (snapshot.exists()) {
                    myName = savedUser;
                    sessionStorage.removeItem('alerted_delete_users'); 
                    showScreen('lobbyScreen');
                    renderLobby();
                } else {
                    alert("该账号已被注销！");
                    localStorage.removeItem('chat_username');
                    setupOneClickLogin();
                }
            });
        }

        function showScreen(id) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById(id).style.display = 'flex';
        }

        window.loginOrRegister = function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return alert('账号和密码不能为空！');

            get(ref(db, 'banned_devices/' + myDeviceId)).then(devSnap => {
                if(devSnap.exists()) {
                    return alert("🚫 你的设备已被管理员永久封禁，无法注册或登录！");
                }

                const encryptedPass = btoa(pass);
                get(ref(db, 'users/' + user)).then((snapshot) => {
                    if (snapshot.exists()) {
                        if (snapshot.val().password === encryptedPass) {
                            myName = user;
                            localStorage.setItem('chat_username', myName); 
                            update(ref(db, 'users/' + user), { deviceId: myDeviceId });
                            
                            sessionStorage.removeItem('alerted_delete_users');
                            showScreen('lobbyScreen');
                            renderLobby();
                        } else alert('密码错误！');
                    } else {
                        if(confirm("检测到新账号，是否注册？")) {
                            set(ref(db, 'users/' + user), { password: encryptedPass, deviceId: myDeviceId }).then(() => {
                                myName = user;
                                localStorage.setItem('chat_username', myName); 
                                sessionStorage.removeItem('alerted_delete_users');
                                showScreen('lobbyScreen');
                                renderLobby();
                            });
                        }
                    }
                });
            });
        }

        window.deleteAccount = function() {
            if(!confirm("⚠️ 警告：确定要注销当前账号吗？")) return;
            remove(ref(db, 'users/' + myName)).then(() => {
                alert("账号已注销。");
                localStorage.clear(); 
                window.location.reload();
            });
        }

        function renderLobby() {
            document.getElementById('myNameDisplay').innerText = myName;
            const listEl = document.getElementById('myGroupList');
            listEl.innerHTML = '';
            if(myGroups.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">你还没有加入任何群</div>';
                return;
            }
            myGroups.forEach(gid => {
                get(ref(db, `group_info/${gid}`)).then(snap => {
                    if(snap.exists()) {
                        const gName = snap.val().name || ("群聊 " + gid);
                        const div = document.createElement('div');
                        div.className = 'chat-item';
                        div.innerHTML = `<div class="avatar">👥</div><div class="info"><div class="name">${gName}</div></div>`;
                        div.onclick = () => enterChat(gid);
                        listEl.appendChild(div);
                    }
                });
            });
        }

        window.createGroup = function() {
            const gName = prompt("第一步：请给新群聊起个名字：");
            if(!gName || gName.trim() === "") return alert("取消创建：群名不能为空！");
            const gid = Math.floor(1000 + Math.random() * 9000).toString();
            set(ref(db, 'group_info/' + gid), { creator: myName, name: gName.trim(), admins: [myName] }).then(() => {
                alert(`🎉 建群成功！\n群名：${gName}\n群号：${gid}`);
                if(!myGroups.includes(gid)) myGroups.push(gid);
                localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                enterChat(gid);
            });
        }

        window.joinGroup = function() {
            const gid = document.getElementById('joinGroupId').value.trim();
            if (!gid) return;
            get(ref(db, 'group_info/' + gid)).then((snap) => {
                if (snap.exists()) {
                    if(!myGroups.includes(gid)) myGroups.push(gid);
                    localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                    enterChat(gid);
                    push(ref(db, `groups/${gid}/messages`), { sender: "📢 系统提示", text: `${myName} 加入了群聊`, time: Date.now() });
                } else alert("❌ 群号不存在！");
            });
        }

        window.leaveGroup = function() {
            if(!confirm("确定要退出该群聊吗？")) return;
            myGroups = myGroups.filter(id => id !== currentGroupId);
            localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
            goLobby();
        }

        function enterChat(gid) {
            currentGroupId = gid;
            showScreen('chatScreen');
            document.getElementById('chatContent').innerHTML = '';

            onValue(ref(db, 'group_info/' + gid), (snap) => {
                if(snap.exists()) {
                    currentGroupInfo = snap.val();
                    document.getElementById('displayGroupName').innerText = currentGroupInfo.name || ("群 " + gid);
                } else {
                    if(currentGroupId === gid) {
                        if(myGroups.includes(gid)) {
                            myGroups = myGroups.filter(id => id !== gid);
                            localStorage.setItem('chat_mygroups', JSON.stringify(myGroups));
                            alert("该群已被强制销毁！");
                        }
                        goLobby();
                    }
                }
            });

            const messagesRef = query(ref(db, `groups/${gid}/messages`), limitToLast(50));
            onValue(messagesRef, (snapshot) => {
                const box = document.getElementById('chatContent');
                box.innerHTML = ''; 
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        addMessageToUI(data.sender, data.text);
                    });
                }
            });
        }

        window.goLobby = function() {
            currentGroupId = "";
            showScreen('lobbyScreen');
            renderLobby();
        }

        window.sendMsg = function() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            push(ref(db, `groups/${currentGroupId}/messages`), { sender: myName, text: text, time: Date.now() });
        }

        window.handleEnter = function(e) { if (e.key === 'Enter') sendMsg(); }

        function addMessageToUI(sender, text) {
            if (!text) return;
            const isMe = (sender === myName);
            const isBoss = (sender === currentGroupInfo.creator);
            const isAdmin = currentGroupInfo.admins && currentGroupInfo.admins.includes(sender);
            
            const div = document.createElement('div');
            let nameTag = sender;
            
            if (isBoss) nameTag = `<span style="color:#ff3b30;font-weight:bold;">👑群主</span> ${sender}`;
            else if (isAdmin) nameTag = `<span style="color:#f39c12;font-weight:bold;">🛡️管理员</span> ${sender}`;

            if (sender === "👑 作者(隐身)") {
                div.className = `msg theirs`;
                div.innerHTML = `<div class="msg-name">作者(隐身)</div><div class="msg-text admin-glow">${text}</div>`;
            } else if (sender === "📢 系统公告" || sender === "📢 系统提示") {
                div.style.textAlign = 'center';
                div.style.margin = '10px 0';
                div.innerHTML = `<span style="background: rgba(0,0,0,0.1); color: #e74c3c; font-weight:bold; font-size: 12px; padding: 4px 10px; border-radius: 10px;">${text}</span>`;
            } else {
                div.className = `msg ${isMe ? 'mine' : 'theirs'}`;
                let bubbleStyle = "";
                if (isAdmin && !isMe) bubbleStyle = "background: linear-gradient(135deg, #fff3e0, #ffe0b2); border: 1px solid #ffb74d;";

                div.innerHTML = `
                    <div class="msg-name">${!isMe ? nameTag : '我'}</div>
                    <div class="msg-text" style="${bubbleStyle}">${text}</div>
                `;
            }
            const box = document.getElementById('chatContent');
            box.appendChild(div);
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
        }

        window.openGroupSettings = function() {
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('displayGroupId').innerText = currentGroupId;
            loadMemberList();
        }
        window.closeSettings = function() { document.getElementById('settingsModal').style.display = 'none'; }

        // 加载成员列表（包含设管/撤管/踢人）
        function loadMemberList() {
            const memberListEl = document.getElementById('memberList');
            memberListEl.innerHTML = '<div style="text-align:center; color:#888; padding:10px;">正在扫描...</div>';
            const membersSet = new Set();
            get(ref(db, `groups/${currentGroupId}/messages`)).then((snapshot) => {
                if(snapshot.exists()) {
                    snapshot.forEach((msg) => {
                        const sender = msg.val().sender;
                        if(!sender.includes("作者") && !sender.includes("📢")) membersSet.add(sender);
                    });
                }
                membersSet.add(currentGroupInfo.creator);
                membersSet.add(myName);

                memberListEl.innerHTML = '';
                const iAmOwner = (myName === currentGroupInfo.creator);

                membersSet.forEach(member => {
                    const isMemberBoss = (member === currentGroupInfo.creator);
                    const isMemberAdmin = (currentGroupInfo.admins && currentGroupInfo.admins.includes(member));
                    let tag = isMemberBoss ? "👑 群主" : (isMemberAdmin ? "🛡️ 管理员" : "");

                    // 群主专属权限操作
                    let actionBtn = "";
                    if (iAmOwner && !isMemberBoss && member !== myName) {
                        if (isMemberAdmin) {
                            // 新增：撤销管理员按钮
                            actionBtn = `<button onclick="removeAdmin('${member}')" style="padding:5px 10px; background:#f39c12; color:#fff; border:none; border-radius:6px padding; font-bottom-size:12px; margin-right:5:px;">撤管</button>`;
                        } else {
 calc                            // 设为管理员按钮
                            actionBtn = `<button onclick="addAdminByName('${member}')" style="padding:5px 10px; background:#007aff; color:#fff; border:none; border-radius:6px; font-size:12px; margin-right:5px;">设管</button>`;
                        }
                        // 踢出按钮
                        actionBtn += `<button onclick="kickUser('${member}')" style="padding:5px 10px; background:#ffebeb; color:#ff3b30; border:1px solid #ffcccc; border-radius:6px; font-size:12px;">踢出</button>`;
                    } 
                    // 管理员可以踢普通成员
                    else if (!iAmOwner && currentGroupInfo.admins.includes(myName) && !isMemberBoss && !isMemberAdmin && member !== myName) {
                        actionBtn = `<button onclick="kickUser('${member}')" style="padding:5px 10px; background:#ffebeb; color:#ff3b30; border:1px solid #ffcccc; border-radius:6px; font-size:12px;">踢出</button>`;
                    }

                    const row = document.createElement('div');
                    row.style = "display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee;";
                    row.innerHTML = `
                        <div><span style="font-weight:bold; color:#333;">${member}</span> <span style="font-size:12px; color:#f39c12;">${tag}</span></div>
                        <div>${actionBtn}</div>
                    `;
                    memberListEl.appendChild(row);
                });
            });
        }

        // 快捷设为管理员
        window.addAdminByName = function(name) {
            if (myName !== currentGroupInfo.creator) return;
            const newAdmins = [...currentGroupInfo.admins, name];
            update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => { 
                alert(name + " 已被设为管理员！"); 
                loadMemberList();
            });
        }

        // 新增：撤销管理员权限
        window.removeAdmin = function(name) {
            if (myName !== currentGroupInfo.creator) return;
            if(!confirm(`确定要撤销【${name}】的管理员权限吗？`)) return;
            
            const newAdmins = currentGroupInfo.admins.filter(admin => admin !== name);
            update(ref(db, 'group_info/' + currentGroupId), { admins: newAdmins }).then(() => { 
                alert(name + " 已被撤销管理员！"); 
                loadMemberList();
            });
        }

        window.kickUser = function(name) {
            if(!confirm(`确定将【${name}】踢出群聊吗？`)) return;
            set(ref(db, `groups/${currentGroupId}/kicked/${name}`), true).then(() => {
                push(ref(db, `groups/${currentGroupId}/messages`), { sender: "📢 系统提示", text: `${name} 已被踢出`, time: Date.now() });
                if(name === myName) goLobby();
                else loadMemberList();
            });
        }

        window.copyGroupId = function() {
            navigator.clipboard.writeText(currentGroupId).then(() => { alert("群号已复制！"); });
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #ededed; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        #loginScreen, #lobbyScreen, #chatScreen { display: none; flex: 1; flex-direction: column; min-height: 0; }
        #loginScreen { background: #fff; justify-content: center; align-items: center;}
        
        .lobby-header { background: #ededed; padding: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd;}
        .logout-btn { background: none; border: none; color: #ff3b30; font-size: 14px; cursor: pointer; }
        .lobby-btns { padding: 20px; display: flex; gap: 10px; background: #fff; border-bottom: 8px solid #ededed;}
        .lobby-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; background: #007aff; color: white;}
        .btn-join-box { display: flex; gap: 10px; padding: 20px; background: #fff;}
        .btn-join-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none;}
        .btn-join-box button { padding: 0 20px; background: #07c160; color: white; border: none; border-radius: 8px; font-weight: bold;}
        
        .group-list { flex: 1; overflow-y: auto; background: #fff;}
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .avatar { width: 50px; height: 50px; border-radius: 8px; background: #07c160; display: flex; justify-content: center; align-items: center; font-size: 24px; margin-right: 15px; }
        .info .name { font-size: 17px; font-weight: 500; }
        
        .header { background: #ededed; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-shrink: 0;}
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header h1 { font-size: 18px; color: #000; margin: 0;}
        .leave-btn { background: none; border: none; color: #007aff; font-size: 16px; cursor: pointer; }
        .settings-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        .chat-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; -webkit-overflow-scrolling: touch; }
        .msg { display: flex; flex-direction: column; max-width: 80%; }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-name { font-size: 12px; color: #888; margin-bottom: 5px; }
        .msg-text { padding: 12px 16px; border-radius: 12px; font-size: 16px; line-height: 1.4; word-break: break-all;}
        .msg.mine .msg-text { background: #95ec69; color: #000; border-top-right-radius: 2px; }
        .msg.theirs .msg-text { background: #fff; color: #000; border-top-left-radius: 2px; }
        
        .admin-glow {
            background: linear-gradient(135deg, #ff3b30, #ff007f) !important;
            color: #fff !important;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.8), 0 0 30px rgba(255, 0, 127, 0.5) !important;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(255, 59, 48, 0.6); }
            50% { box-shadow: 0 0 20px rgba(255, 59, 48, 1); }
            100% { box-shadow: 0 0 10px rgba(255, 59, 48, 0.6); }
        }

        .input-area { 
            padding: 15px; background: #f7f7f7; border-top: 1px solid #ddd; 
            display: flex; gap: 10px; flex-shrink: 0; 
           (15px + env(safe-area-inset-bottom)); 
        }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #fff; outline: none; }
        .input-area button { padding: 0 25px; border-radius: 8px; background: #07c160; color: white; border: none; font-weight: bold; }
        #typingIndicator { display: none; font-size: 12px; color: #07c160; padding: 5px 20px; background: #f7f7f7; font-style: italic; flex-shrink: 0;}
        
        #settingsModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-box { background: #fff; width: 85%; max-width: 320px; padding: 20px; border-radius: 12px; max-height: 80vh; overflow-y: auto;}
        .modal-box h3 { margin-bottom: 15px; text-align: center; }
        .modal-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; outline: none;}
        .modal-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        .member-list { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px; width:100%;">
            <h1 style="color:#07c160; margin-bottom:30px;">聊天室</h1>
            <input type="text" id="username" placeholder="输入账号" style="width:100%; max-width:300px; padding:15px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; outline:none;">
            <input type="password" id="password" placeholder="输入密码" style="width:100%; max-width:300px; padding:15px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; outline:none;">
            <button onclick="loginOrRegister()" style="width:100%; max-width:300px; padding:15px; background:#07c160; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px; margin-bottom: 15px;">登录 / 注册</button>
            
            <button id="oneClickLoginBtn" onclick="doOneClickLogin()" style="width:100%; max-width:300px; padding:15px; background:#f0f0f0; color:#07c160; border:1px solid #07c160; border-radius:8px; font-weight:bold; font-size:16px; display:none;">一键登录</button>
        </div>
    </div>

    <div id="lobbyScreen">
        <div class="lobby-header">
            <span>聊天大厅</span>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="myNameDisplay" style="font-size:14px; color:#07c160;"></span>
                <button class="logout-btn" onclick="deleteAccount()">注销</button>
            </div>
        </div>
        <div class="lobby-btns">
            <button class="btn-create" onclick="createGroup()">➕ 创建新群聊</button>
        </div>
        <div class="btn-join-box">
            <input type="text" id="joinGroupId" placeholder="输入群号加入">
            <button onclick="joinGroup()">加入</button>
        </div>
        <div class="group-list" id="myGroupList"></div>
    </div>

    <div id="chatScreen">
        <div class="header">
            <div class="header-left">
                <button class="leave-btn" onclick="goLobby()">〈 大厅</button>
                <h1 id="displayGroupName">群聊</h1>
            </div>
            <button class="settings-btn" onclick="openGroupSettings()">⚙️</button>
        </div>
        <div class="chat-content" id="chatContent"></div>
        <div id="typingIndicator"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="输入消息..." oninput="handleTyping()" onkeypress="handleEnter(event)">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal-box">
            <h3>群聊设置</h3>
            <div style="background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px;">
                群号：<strong id="displayGroupId" style="color: #007aff; font-size: 18px;"></strong>
                <button onclick="copyGroupId()" style="width: auto; padding: 5px 10px; margin: 5px auto 0; display: block; background: #007aff; color: white; font-size: 12px; border-radius:4px; border:none;">一键复制</button>
            </div>
            
            <div class="member-list">
                <h4 style="margin-bottom: 10px; color:#333; font-size:15px; text-align:left;">群成员管理</h4>
                <div id="memberList"></div>
            </div>

            <button onclick="leaveGroup()" style="background: #ffebeb; color: #ff3b30; border: 1px solid #ffcccc; margin-top: 20px;">退出群聊</button>
            <button onclick="closeSettings()" style="background: #eee; color: #333; margin-top: 5px;">关闭</button>
        </div>
    </div>
</body>
</html>
